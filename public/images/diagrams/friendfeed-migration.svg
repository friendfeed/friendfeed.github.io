<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ffmig-title ffmig-desc">
<title id="ffmig-title">Diagram showing FriendFeed's community migrating to three platforms</title>
<desc id="ffmig-desc">FriendFeed at the top branches down into three destinations: X (formerly Twitter), FreeFeed, and Bluesky.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8b8a85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="250" y="40" width="180" height="64" rx="10" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
<text x="340" y="65" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2c2c2a">FriendFeed</text>
<text x="340" y="83" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5f5e5a">2007–2015</text>

<path d="M340 104 L340 140" fill="none" stroke="#8b8a85" stroke-width="0.5"/>
<path d="M120 140 L560 140" fill="none" stroke="#8b8a85" stroke-width="0.5"/>
<path d="M120 140 L120 176" fill="none" stroke="#8b8a85" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 140 L340 176" fill="none" stroke="#8b8a85" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M560 140 L560 176" fill="none" stroke="#8b8a85" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="30" y="180" width="180" height="108" rx="10" fill="#141414" stroke="#141414" stroke-width="0.5"/>
<circle cx="120" cy="222" r="27" fill="#ffffff"/>
<g transform="translate(103,205) scale(1.35)" fill="#141414">
<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
</g>
<text x="120" y="260" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">X</text>
<text x="120" y="277" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c9c9c6">formerly Twitter</text>

<rect x="250" y="180" width="180" height="108" rx="10" fill="#0f6e56" stroke="#0f6e56" stroke-width="0.5"/>
<circle cx="340" cy="222" r="27" fill="#ffffff"/>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#0f6e56">ff</text>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">FreeFeed</text>
<text x="340" y="277" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#bfe4d9">open-source, self-hosted</text>

<rect x="470" y="180" width="180" height="108" rx="10" fill="#1185fe" stroke="#1185fe" stroke-width="0.5"/>
<circle cx="560" cy="222" r="27" fill="#ffffff"/>
<g transform="translate(542,204) scale(1.5)" fill="#1185fe">
