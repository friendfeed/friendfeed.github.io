  <line x1="247" y1="227" x2="284" y2="300" stroke="#3a6a5a" stroke-width="0.6" opacity="0.5"/>
  <g transform="translate(210, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#2a4a3a" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#3a7a5a" text-anchor="middle">Categories</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Members</text>
  </g>
  <g transform="translate(284, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#2a4a3a" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#3a7a5a" text-anchor="middle">Activity</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ History</text>
  </g>

