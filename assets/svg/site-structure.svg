  <line x1="394" y1="227" x2="368" y2="300" stroke="#7a5a2a" stroke-width="0.6" opacity="0.5"/>
  <line x1="394" y1="227" x2="424" y2="300" stroke="#7a5a2a" stroke-width="0.6" opacity="0.5"/>
  <g transform="translate(368, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#3a2a10" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#8a6a2a" text-anchor="middle">Year View</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Events</text>
  </g>
  <g transform="translate(424, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#3a2a10" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#8a6a2a" text-anchor="middle">Growth</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Charts</text>
  </g>

