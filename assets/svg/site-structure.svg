  <line x1="545" y1="227" x2="510" y2="300" stroke="#5a3a6a" stroke-width="0.6" opacity="0.5"/>
  <line x1="545" y1="227" x2="580" y2="300" stroke="#5a3a6a" stroke-width="0.6" opacity="0.5"/>
  <g transform="translate(510, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#3a2a4a" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#7a5a9a" text-anchor="middle">Platforms</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Find People</text>
  </g>
  <g transform="translate(580, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#3a2a4a" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#7a5a9a" text-anchor="middle">Pathways</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Guides</text>
