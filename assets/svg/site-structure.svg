    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#2a3a5a" stroke-width="0.6"/>
    <text x="0" y="-2" font-family="'Courier New', monospace" font-size="8" fill="#4a6a8a" text-anchor="middle">Profiles</text>
    <text x="0" y="11" font-family="'Courier New', monospace" font-size="7" fill="#3a4a6a" text-anchor="middle">+ Connections</text>
  </g>

