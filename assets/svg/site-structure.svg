  <g transform="translate(790, 205)">
    <rect x="-45" y="-22" width="90" height="44" rx="5" fill="url(#sec-grad)" stroke="#3a4a6a" stroke-width="0.9"/>
    <text x="0" y="-4" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#8a9ab8" text-anchor="middle">About</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="7.5" fill="#4a5a7a" text-anchor="middle">Mission · Terms</text>
