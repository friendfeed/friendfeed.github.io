  <line x1="100" y1="227" x2="140" y2="300" stroke="#3a5a8a" stroke-width="0.6" opacity="0.5"/>
  <g transform="translate(60, 315)">
    <rect x="-42" y="-16" width="84" height="32" rx="3" fill="#0f1520" stroke="#2a3a5a" stroke-width="0.6"/>
