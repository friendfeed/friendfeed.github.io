<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Website information architecture diagram">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0f14"/>
      <stop offset="100%" style="stop-color:#111520"/>
    </linearGradient>
    <linearGradient id="root-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f10"/>
      <stop offset="100%" style="stop-color:#1e1710"/>
    </linearGradient>
    <linearGradient id="sec-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2030"/>
      <stop offset="100%" style="stop-color:#131825"/>
    </linearGradient>
    <marker id="tree-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#e8a04a" opacity="0.5"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="url(#ss-bg)" rx="12"/>

  <!-- Title -->
  <text x="430" y="34" font-family="Georgia, serif" font-size="15" font-weight="600" fill="#c8d4e8" text-anchor="middle" letter-spacing="2">INFORMATION ARCHITECTURE</text>
  <line x1="200" y1="44" x2="660" y2="44" stroke="#e8a04a" stroke-width="0.5" opacity="0.4"/>

  <!-- ROOT: Home node -->
  <g transform="translate(380, 90)">
    <rect x="-70" y="-24" width="140" height="48" rx="6" fill="url(#root-grad)" stroke="#e8a04a" stroke-width="1.2"/>
    <text x="0" y="-4" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#e8a04a" text-anchor="middle">Home</text>
    <text x="0" y="14" font-family="'Courier New', monospace" font-size="8" fill="#8a7a5a" text-anchor="middle">Overview · Featured · Stats</text>
  </g>

  <!-- Connector lines from Home -->
  <line x1="380" y1="114" x2="100" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>
  <line x1="380" y1="114" x2="247" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>
  <line x1="380" y1="114" x2="394" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>
  <line x1="380" y1="114" x2="545" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>
  <line x1="380" y1="114" x2="697" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>
  <line x1="380" y1="114" x2="790" y2="185" stroke="#e8a04a" stroke-width="0.8" opacity="0.4" marker-end="url(#tree-arrow)"/>

  <!-- Lvl 2 section nodes -->
  <!-- Users -->
  <g transform="translate(100, 205)">
    <rect x="-55" y="-22" width="110" height="44" rx="5" fill="url(#sec-grad)" stroke="#3a5a8a" stroke-width="0.9"/>
    <text x="0" y="-4" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#7ab0e0" text-anchor="middle">Users</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="7.5" fill="#4a5a7a" text-anchor="middle">Directory · Profiles</text>
  </g>
  <!-- Rooms -->
  <g transform="translate(247, 205)">
    <rect x="-55" y="-22" width="110" height="44" rx="5" fill="url(#sec-grad)" stroke="#3a6a5a" stroke-width="0.9"/>
    <text x="0" y="-4" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#6ac0a0" text-anchor="middle">Rooms</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="7.5" fill="#4a5a7a" text-anchor="middle">Topics · Communities</text>
