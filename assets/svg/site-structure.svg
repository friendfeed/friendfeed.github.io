    <text x="0" y="-4" font-family="Georgia, serif" font-size="12" font-weight="600" fill="#e8a04a" text-anchor="middle">Timeline</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="7.5" fill="#4a5a7a" text-anchor="middle">History · Milestones</text>
