<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/webp" sizes="32x32" href="./favicon-32.webp" />
    <link rel="icon" type="image/webp" sizes="16x16" href="./favicon-16.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.webp" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#5b9bd5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="description"
      content="آرشیو غیررسمی جامعه فارسی‌زبان فرندفید (۱۳۸۶-۱۳۸۸) و ردیابی حساب‌های کاربران در ایکس"
    />
    <link rel="canonical" href="https://friendfeed.github.io/" />
    <title>فرندفید فارسی | آرشیو</title>

    <!-- Open Graph / Twitter defaults. Overridden per-route at runtime by
         src/seo/useSEO.ts, and baked per-route at build time into the
         static shells produced by scripts/generate-static-routes.mjs --
         these are just the safety-net values for the root route and any
         crawler that reads neither. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="فرندفید فارسی | آرشیو" />
    <meta property="og:title" content="فرندفید فارسی | آرشیو جامعه و ردیابی کاربران در ایکس" />
    <meta
      property="og:description"
      content="آرشیو غیررسمی جامعه فارسی‌زبان فرندفید (۱۳۸۶-۱۳۸۸) و ردیابی حساب‌های کاربران قدیمی فرندفید در ایکس (توییتر سابق)."
    />
    <meta property="og:url" content="https://friendfeed.github.io/" />
    <meta property="og:image" content="https://friendfeed.github.io/icon-512.webp" />
    <meta property="og:locale" content="fa_IR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="فرندفید فارسی | آرشیو جامعه و ردیابی کاربران در ایکس" />
    <meta
      name="twitter:description"
      content="آرشیو غیررسمی جامعه فارسی‌زبان فرندفید (۱۳۸۶-۱۳۸۸) و ردیابی حساب‌های کاربران قدیمی فرندفید در ایکس (توییتر سابق)."
    />
    <meta name="twitter:image" content="https://friendfeed.github.io/icon-512.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "فرندفید فارسی | آرشیو",
        "url": "https://friendfeed.github.io",
        "inLanguage": "fa",
        "description": "آرشیو غیررسمی جامعه فارسی‌زبان فرندفید (۱۳۸۶-۱۳۸۸) و ردیابی حساب‌های کاربران در ایکس"
      }
    </script>
    <script>
      // Decode half of the GitHub Pages SPA fallback -- see public/404.html
      // for the full explanation. If we were bounced here from 404.html
      // (recognizable by the "?/" the redirect appends), rewrite the
      // visible URL back to the real path before React mounts, so
      // react-router sees the correct route on first render.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
